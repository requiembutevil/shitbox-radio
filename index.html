<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>poopbox radio</title>
  <style>
    :root {
      color-scheme: light dark;
      --page: light-dark(#f4f2ec, #171719);
      --panel: light-dark(#faf9f5, #1d1d20);
      --panel-soft: light-dark(#eae7de, #25252a);
      --text: light-dark(#292721, #ece9e2);
      --muted: light-dark(#777268, #a29da0);
      --border: light-dark(#d2cdc1, #3a383e);
      --link: light-dark(#544083, #c5b6ef);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    a { color: inherit; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px clamp(16px, 5vw, 56px);
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .brand-img {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      background: #5d40a4;
      border: 1px solid var(--border);
    }

    .brand-img img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .brand-img img[hidden] { display: none; }

    .brand-title { font-size: 16px; font-weight: 700; line-height: 1.1; }
    .brand-meta { color: var(--muted); font-size: 11px; }

    .toplink { font-size: 12px; color: var(--muted); }
    .toplink:hover { color: var(--text); }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      font-weight: 700;
    }

    .sub { color: var(--muted); margin: 6px 0 0; }
    .update-line { color: var(--muted); margin: 2px 0 0; font-size: 12px; }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 22px 0 12px;
    }

    input[type="search"] {
      flex: 1;
      min-width: 100px;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      background: var(--panel);
      padding: 0 11px;
      font: inherit;
    }

    input[type="search"]:focus, select:focus {
      outline: 2px solid var(--link);
      outline-offset: -1px;
    }

    select {
      height: 38px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
      padding: 0 8px;
      max-width: 180px;
    }

    .statusrow {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }

    .tablewrap {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 650px;
      text-align: left;
    }

    th {
      padding: 9px 12px;
      background: var(--panel-soft);
      font-size: 13px;
      font-weight: 600;
    }

    td {
      padding: 10px 12px;
      border-top: 1px solid var(--border);
    }

    tbody tr:hover { background: var(--panel-soft); }

    .num { color: var(--muted); width: 40px; }
    .songname { font-weight: 600; }
    .artist, .cat, .length-value { color: var(--muted); }
    .length-value { white-space: nowrap; }

    .audio-link { color: var(--link); }
    .audio-link:hover { text-decoration: none; }

    .empty { padding: 32px 16px; text-align: center; color: var(--muted); }

    .note {
      margin-top: 12px;
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
    }

    footer {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
    }

    @media (max-width: 600px) {
      main { padding: 24px 14px 40px; }
      .toolbar { flex-direction: column; align-items: stretch; }
      select { max-width: none; }
      .note { flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-img"><img id="customBrandImage" alt="" hidden></div>
      <div>
        <div class="brand-title">poopbox radio</div>
        <div class="brand-meta">gd songs n stuff</div>
      </div>
    </div>
    <a class="toplink" href="https://raw.githubusercontent.com/starquiem/requiems-jukebox-index/main/index.json" target="_blank" rel="noreferrer">index.json</a>
  </header>

  <main>
    <h1>the songs.</h1>
    <p class="sub">songs i put in here for gd. thats pretty much it.</p>
    <p class="update-line">last update: <span id="latestUpdate">-</span></p>

    <div class="toolbar">
      <input id="search" type="search" placeholder="search songs, artists, ids" autocomplete="off" aria-label="Search songs">

      <select id="sortSongs" aria-label="Sort songs">
        <option value="index">Index order</option>
        <option value="name-asc">Name: A-Z</option>
        <option value="name-desc">Name: Z-A</option>
        <option value="artist-asc">Artist: A-Z</option>
        <option value="artist-desc">Artist: Z-A</option>
        <option value="length-asc">Shortest first</option>
        <option value="length-desc">Longest first</option>
      </select>

      <select id="categoryFilter" aria-label="Filter songs by category">
        <option value="all">All categories</option>
      </select>
    </div>

    <div class="statusrow">
      <span id="count">loading...</span>
      <span id="loadstatus">fetching index.json</span>
    </div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Artist</th>
            <th>Category</th>
            <th>Audio</th>
            <th>Length</th>
          </tr>
        </thead>
        <tbody id="songs"></tbody>
      </table>
      <div id="empty" class="empty" hidden>nothing found.</div>
    </div>

    <div class="note">
      <span>audio is on jukehost. these are song ids, not level ids.</span>
      <a href="https://github.com/starquiem/requiems-jukebox-index" target="_blank" rel="noreferrer">index on github</a>
    </div>

    <footer>
      <span>shitbox studio</span>
      <span id="visible">loading</span>
    </footer>
  </main>

  <script>
    const INDEX_URL = "https://raw.githubusercontent.com/starquiem/requiems-jukebox-index/main/index.json";
    let songs = [];

    const tbody = document.getElementById("songs");
    const empty = document.getElementById("empty");
    const search = document.getElementById("search");
    const sortSongs = document.getElementById("sortSongs");
    const categoryFilter = document.getElementById("categoryFilter");
    const count = document.getElementById("count");
    const visible = document.getElementById("visible");
    const loadstatus = document.getElementById("loadstatus");
    const latestUpdate = document.getElementById("latestUpdate");
    const customBrandImage = document.getElementById("customBrandImage");

    // change this URL if you want a different top-bar image
    const BRAND_IMAGE_URL = "https://i.pinimg.com/originals/55/40/2a/55402a5ada10ea91ee66e3f03109abf2.jpg";

    if (BRAND_IMAGE_URL.trim()) {
      customBrandImage.onload = () => { customBrandImage.hidden = false; };
      customBrandImage.onerror = () => { customBrandImage.hidden = true; };
      customBrandImage.src = BRAND_IMAGE_URL.trim();
    }

    function render() {
      const query = search.value.trim().toLowerCase();

      let filtered = songs.filter(song => {
        const searchable = [
          song.name,
          song.artist,
          song.category,
          song.url,
          ...song.ids
        ].join(" ").toLowerCase();

        const matchesCategory =
          categoryFilter.value === "all" ||
          song.category === categoryFilter.value;

        return searchable.includes(query) && matchesCategory;
      });

      const collator = new Intl.Collator(undefined, {
        numeric: true,
        sensitivity: "base"
      });

      const durationValue = song =>
        Number.isFinite(song.durationSeconds)
          ? song.durationSeconds
          : Infinity;

      switch (sortSongs.value) {
        case "name-asc":
          filtered.sort((a, b) => collator.compare(a.name, b.name));
          break;

        case "name-desc":
          filtered.sort((a, b) => collator.compare(b.name, a.name));
          break;

        case "artist-asc":
          filtered.sort((a, b) =>
            collator.compare(a.artist, b.artist) ||
            collator.compare(a.name, b.name)
          );
          break;

        case "artist-desc":
          filtered.sort((a, b) =>
            collator.compare(b.artist, a.artist) ||
            collator.compare(a.name, b.name)
          );
          break;

        case "length-asc":
          filtered.sort((a, b) => durationValue(a) - durationValue(b));
          break;

        case "length-desc":
          filtered.sort((a, b) => {
            const da = durationValue(a);
            const db = durationValue(b);

            if (!Number.isFinite(da)) {
              return Number.isFinite(db) ? 1 : 0;
            }

            if (!Number.isFinite(db)) return -1;
            return db - da;
          });
          break;
      }

      tbody.replaceChildren();

      filtered.forEach((song, index) => {
        const row = document.createElement("tr");

        const number = document.createElement("td");
        number.className = "num";
        number.textContent = String(index + 1).padStart(2, "0");

        const nameCell = document.createElement("td");
        nameCell.className = "songname";
        nameCell.textContent = song.name;

        const artist = document.createElement("td");
        artist.className = "artist";
        artist.textContent = song.artist;

        const categoryCell = document.createElement("td");
        categoryCell.className = "cat";
        categoryCell.textContent = song.category;

        const audioCell = document.createElement("td");

        if (song.url) {
          const audio = document.createElement("a");
          audio.className = "audio-link";
          audio.href = song.url;
          audio.target = "_blank";
          audio.rel = "noreferrer";
          audio.textContent = "open";
          audioCell.append(audio);
        } else {
          audioCell.textContent = "no link";
        }

        const lengthCell = document.createElement("td");
        lengthCell.className = "length-value";
        lengthCell.textContent = Number.isFinite(song.durationSeconds)
          ? formatDuration(song.durationSeconds)
          : song.durationStatus === "loading"
            ? "..."
            : "-";

        row.append(
          number,
          nameCell,
          artist,
          categoryCell,
          audioCell,
          lengthCell
        );

        tbody.append(row);
      });

      empty.hidden = filtered.length !== 0;

      count.textContent =
        `${filtered.length} ${filtered.length === 1 ? "song" : "songs"}`;

      visible.textContent = `showing ${filtered.length} of ${songs.length}`;
    }

    function formatDuration(totalSeconds) {
      const total = Math.floor(totalSeconds);
      const seconds = String(total % 60).padStart(2, "0");
      const minutes = Math.floor(total / 60);

      if (minutes >= 60) {
        return `${Math.floor(minutes / 60)}:${String(minutes % 60).padStart(2, "0")}:${seconds}`;
      }

      return `${minutes}:${seconds}`;
    }

    function loadSongDuration(song) {
      if (!song.url) {
        song.durationStatus = "unavailable";
        return;
      }

      const audio = new Audio();
      audio.preload = "metadata";

      audio.addEventListener("loadedmetadata", () => {
        if (Number.isFinite(audio.duration) && audio.duration >= 0) {
          song.durationSeconds = audio.duration;
          song.durationStatus = "loaded";
        } else {
          song.durationStatus = "unavailable";
        }

        render();
        audio.src = "";
      }, { once: true });

      audio.addEventListener("error", () => {
        song.durationStatus = "unavailable";
        render();
      }, { once: true });

      audio.src = song.url;
      audio.load();
    }

    async function loadIndex() {
      loadstatus.textContent = "loading the index...";

      try {
        const response = await fetch(INDEX_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`GitHub returned HTTP ${response.status}`);
        }

        const index = await response.json();

        latestUpdate.textContent =
          index?.lastUpdate != null ? `#${index.lastUpdate}` : "unknown";

        const hosted = index?.nongs?.hosted;

        if (
          !hosted ||
          typeof hosted !== "object" ||
          Array.isArray(hosted)
        ) {
          throw new Error(
            'Could not find the "nongs.hosted" object in index.json'
          );
        }

        songs = Object.entries(hosted).map(([key, item]) => ({
          key,
          name: String(item?.name || key),
          artist: String(item?.artist || "Unknown artist"),
          category: String(item?.category || "Other"),
          url: typeof item?.url === "string" ? item.url : "",
          ids: Array.isArray(item?.songs)
            ? item.songs
            : item?.songs == null
              ? []
              : [item.songs],
          durationSeconds: null,
          durationStatus:
            typeof item?.url === "string" && item.url
              ? "loading"
              : "unavailable",
          type: "nong",
          startOffset: Number(item?.startOffset) || 0
        }));

        const categories = [
          ...new Set(songs.map(song => song.category))
        ].sort((a, b) => a.localeCompare(b));

        categoryFilter.replaceChildren();

        const allCategories = document.createElement("option");
        allCategories.value = "all";
        allCategories.textContent = "All categories";
        categoryFilter.append(allCategories);

        categories.forEach(category => {
          const option = document.createElement("option");
          option.value = category;
          option.textContent = category;
          categoryFilter.append(option);
        });

        songs.forEach(loadSongDuration);

        loadstatus.textContent = `got ${songs.length} songs from the index`;

        render();
      } catch (error) {
        loadstatus.textContent = "couldn't load the index";
        latestUpdate.textContent = "unavailable";
        count.textContent = "index failed to load";
        visible.textContent = "check the JSON URL and try again";

        empty.hidden = false;
        empty.textContent = "couldn't load the songs. check that the JSON is public and valid, then refresh.";

        console.error("Failed to load shitbox radio index:", error);
      }
    }

    search.addEventListener("input", render);
    sortSongs.addEventListener("change", render);
    categoryFilter.addEventListener("change", render);

    render();
    loadIndex();
  </script>
</body>
</html>
